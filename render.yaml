# Render Blueprint: New > Blueprint > pick this repository. Both services are on the free plan.
# See docs/DEPLOY.md for what each one is, the free-tier limits, and the alternatives.
services:
  # 1. The public demo: the standalone twin (no server; the PLC program, the vision model and
  #    the order simulation all run in the visitor's browser). A static site: free, on a CDN,
  #    never sleeps. This is the link for LinkedIn and the README.
  - type: web
    name: stf-twin
    runtime: static
    rootDir: web
    buildCommand: npm ci --no-audit --no-fund && npm run build:pages
    staticPublishPath: dist-pages
    pullRequestPreviewsEnabled: false
    envVars:
      - key: STF_BASE
        value: /
      - key: NODE_VERSION
        value: "20"
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), usb=(), serial=()
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable

  # 2. Optional: the live twin - the Python physics kernel streaming over a WebSocket, with
  #    the web app served by the same process (Dockerfile). Free web services sleep after
  #    15 minutes without traffic and take about a minute to wake. Read-only to the public:
  #    commands need STF_API_TOKEN (generated below; find it in the dashboard).
  - type: web
    name: stf-live
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: STF_API_TOKEN
        generateValue: true
      - key: STF_MAX_WS_CLIENTS
        value: "16"
      - key: GROQ_API_KEY          # the copilot's first model, and fast speech (chat.py, tts.py): set it here, never in git
        sync: false
      - key: GEMINI_API_KEY        # the copilot's fallback models; set it in the Render dashboard (never in git)
        sync: false
      - key: GEMINI_DAILY_LIMIT
        value: "300"
      - key: GEMINI_TTS_DAILY_LIMIT  # spoken answers a day (Gemini TTS)
        value: "100"
      - key: ELEVENLABS_API_KEY      # optional: speech to text and the first voice (docs/TTS_PIPELINE.md); never writes answers
        sync: false
      - key: ELEVENLABS_VOICE_ID_01  # the voice used for every answer (ELEVENLABS_VOICE picks another)
        sync: false
      - key: ELEVENLABS_VOICE_ID_02  # a second voice, not used yet
        sync: false
      - key: ELEVENLABS_MODEL
        value: eleven_multilingual_v2
      - key: OLLAMA_MODEL            # no local model on Render: Gemini models in turn, then the tools
        value: ""
      - key: SUPABASE_URL            # optional: keep guests, chats and photos in Supabase (docs/DATABASE.md)
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # guest sessions (services/api/guests.py): each visitor is a guest of their own, in a cookie
      # signed with this secret; the guests and their chats live in Supabase when its tables exist,
      # else in SQLite on the service's disk (until the next deploy)
      - key: STF_SESSION_SECRET
        generateValue: true
      - key: STF_DB
        value: auto
      - key: STF_GUEST_DAYS
        value: "30"
