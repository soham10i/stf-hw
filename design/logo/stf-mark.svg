<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 80" width="80" height="80" role="img" aria-label="STF Factory Simulation">
  <defs>
    <linearGradient id="stfCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="80" height="80" rx="16" fill="#0D1117"/>
  <!-- isometric cube edges -->
  <g stroke="url(#stfCyan)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer perimeter hexagon -->
    <polygon points="40,8.5 69,25.2 69,54.8 40,71.5 11,54.8 11,25.2" fill="none"/>
    <!-- internal Y connecting to center -->
    <line x1="40" y1="8.5" x2="40" y2="40"/>
    <line x1="40" y1="40" x2="11" y2="54.8"/>
    <line x1="40" y1="40" x2="69" y2="54.8"/>
  </g>
  <!-- center cyan node -->
  <circle cx="40" cy="40" r="6.2" fill="#00E5FF" filter="url(#cyanGlow)"/>
  <!-- top-right white vertex node -->
  <circle cx="69" cy="25.2" r="2.8" fill="#FFFFFF"/>
</svg>