<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="STF Digital Twin — conveyor twin">
  <defs>
    <linearGradient id="amber2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2B45A"/>
      <stop offset="1" stop-color="#D98E2B"/>
    </linearGradient>
  </defs>
  <!-- physical line (top, solid) -->
  <g>
    <rect x="8" y="18" width="48" height="13" rx="6.5" fill="none" stroke="#4E9BD4" stroke-width="2.5"/>
    <circle cx="17" cy="24.5" r="2.2" fill="#4E9BD4"/>
    <circle cx="28" cy="24.5" r="2.2" fill="#4E9BD4"/>
    <circle cx="40" cy="24.5" r="2.2" fill="#4E9BD4"/>
    <circle cx="50" cy="24.5" r="2.2" fill="#4E9BD4"/>
    <circle cx="28" cy="12" r="6.2" fill="url(#amber2)"/>
    <circle cx="30" cy="10.5" r="1.4" fill="#4A2C0E"/>
  </g>
  <!-- digital twin line (bottom, dashed mirror) -->
  <g>
    <rect x="8" y="41" width="48" height="13" rx="6.5" fill="none" stroke="#E8A33D" stroke-width="2.5" stroke-dasharray="5 3.5"/>
    <circle cx="17" cy="47.5" r="2.2" fill="none" stroke="#E8A33D" stroke-width="2" stroke-dasharray="2.5 2"/>
    <circle cx="28" cy="47.5" r="2.2" fill="none" stroke="#E8A33D" stroke-width="2" stroke-dasharray="2.5 2"/>
    <circle cx="40" cy="47.5" r="2.2" fill="none" stroke="#E8A33D" stroke-width="2" stroke-dasharray="2.5 2"/>
    <circle cx="50" cy="47.5" r="2.2" fill="none" stroke="#E8A33D" stroke-width="2" stroke-dasharray="2.5 2"/>
    <circle cx="28" cy="35" r="6.2" fill="none" stroke="#E8A33D" stroke-width="2.2" stroke-dasharray="4 3"/>
  </g>
  <!-- sync link -->
  <path d="M56,31.5 L56,40.5" stroke="#8B929D" stroke-width="2" stroke-linecap="round" stroke-dasharray="1.5 3.5"/>
