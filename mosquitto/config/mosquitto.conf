# Mosquitto configuration for the STF digital twin (the field bus).
#
# Anonymous clients are refused. Create the password file once:
#   docker compose run --rm mosquitto mosquitto_passwd -c /mosquitto/config/passwd stf
# The host publishes the ports on 127.0.0.1 only (docker-compose.yml).

listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous false
password_file /mosquitto/config/passwd

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
