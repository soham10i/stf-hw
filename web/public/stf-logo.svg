<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 113" width="300" height="113" role="img" aria-label="STF Factory Simulation">
  <defs>
    <linearGradient id="stfCyanFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0077FE"/>
    </linearGradient>
    <filter id="cyanGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="300" height="113" rx="16" fill="#0D1117"/>
  <!-- isometric cube mark -->
  <g transform="translate(16, 16.5)">
    <g stroke="url(#stfCyanFull)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="40,8.5 69,25.2 69,54.8 40,71.5 11,54.8 11,25.2" fill="none"/>
      <line x1="40" y1="8.5" x2="40" y2="40"/>
      <line x1="40" y1="40" x2="11" y2="54.8"/>
      <line x1="40" y1="40" x2="69" y2="54.8"/>
    </g>
    <circle cx="40" cy="40" r="6.2" fill="#00E5FF" filter="url(#cyanGlowFull)"/>
    <circle cx="69" cy="25.2" r="2.8" fill="#FFFFFF"/>
  </g>
  <!-- typography -->
  <text x="104" y="58" fill="#FFFFFF" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" letter-spacing="0.02em">STF</text>
  <text x="105" y="78" fill="#94A3B8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="0.22em">FACTORY SIMULATION</text>
</svg>