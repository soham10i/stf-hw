<text x="30" y="185" class="nh">HOW A ROUND COOKIE IS PACKED AND STORED</text>
<text x="30" y="189.2" class="nt">1 An empty tray drops from the nested magazine (escapement forks) onto the lane.</text>
<text x="30" y="192.9" class="nt">2 A delta sets each round cookie straight down into a round pocket: D46.5 vs D45 = 0.75 mm radial clearance &gt; 0.60 mm placement error (lane index + delta + cup).</text>
<text x="30" y="196.6" class="nt">3 The full tray indexes under the top sealer: a heated head seals a peelable film onto the 3 mm flange in 1 s, inside the 2 s index.</text>
<text x="30" y="200.3" class="nt">4 The stacker lifts the sealed pack through spring pawls into the cassette&#x27;s open bottom; the pawls catch the flange (2 mm) and hold the whole stack.</text>
<text x="30" y="204.0" class="nt">5 A full cassette (27 packs = 81 cookies) shuttles to the AMR port. Packs leave through the open top: the first pack in has risen to the top, so retrieval is first in,</text>
<text x="32" y="207.1" class="nt">first out.</text>
<text x="30" y="210.8" class="nt">Proven on the exact CAD (line_cad.containment): every cookie sits in its pocket / tube and every stack on its pawls with zero overlap.</text>
