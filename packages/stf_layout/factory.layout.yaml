# =============================================================================
# Smart Tabletop Factory - canonical layout
# =============================================================================
# THE single source of truth for factory geometry. The kinematic planner, the
# simulation kernel, the browser's scene graph and the URDF exporter all read
# this file. Nothing else may hardcode a coordinate; tests/test_layout_invariants.py
# scans the source tree and fails the build if anything does.
#
# This file replaces four mutually contradictory coordinate tables that used to
# live in database/models.py (two of them), hardware/mock_factory.py (a third,
# with the rack rows inverted) and dashboard/app.py (a fourth). The planner and
# the physics engine were operating in different frames.
#
# Frame convention, declared once: right-handed, +Z up, origin at the
# front-bottom-left corner of the rack.
#
#   +X  travel along the rack face (columns 1..3, then out to the conveyor)
#   +Y  away from the rack face (fork extension direction, belt run)
#   +Z  up (shelf rows A..C)
#
# Axes are NAMED, never numbered. The old code called the HBW's horizontal
# telescoping fork and the VGR's vertical suction column both "the Z axis",
# which is precisely how the two kinematic engines silently disagreed.
# =============================================================================

schema_version: 1

units:
  length: mm
  angle: deg
  time: s
  current: A
  voltage: V

frame:
  handedness: right
  up: z
  origin: rack_front_bottom_left

# -----------------------------------------------------------------------------
# Devices
# -----------------------------------------------------------------------------
devices:

  # --- High-Bay Warehouse stacker crane -------------------------------------
  # Cartesian: travels along the rack, lifts, and telescopes a fork into a slot.
  # Drive data from docs/144643-Encodermotor24V.pdf; the 214 rpm figure is the
  # lab calibration recorded in hardware/hbw_withfaults_simulation.py, which was
  # dead code (its constructor was misspelled `_init_`) but held the only real
  # measurement in the repository.
  #
  #   75 pulses/rev / 4 mm pitch = 18.75 pulses/mm
  #   60 / (214 rpm * 75)        = 3.738 ms/pulse
  #   => 14.27 mm/s
  #
  # The old simulator hardcoded 100 mm/s, i.e. it ran 7.01x too fast.
  hbw:
    kind: cartesian_stacker
    tool: fork
    base:
      xyz: [0.0, 0.0, 0.0]
    joints:
      travel:
        kind: prismatic
        axis: +x
        limits: [0.0, 420.0]     # columns at 100/200/300, conveyor at 400
        home: 0.0
        reference_switch: I2     # per docs/recovered/FACTORY_SPECS.md
        motor_id: HBW_X
        positions:
          rest: 400.0
          conveyor: 400.0
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

      lift:
        kind: prismatic
        axis: +z
        limits: [0.0, 320.0]     # rows at 100/200/300
        home: 0.0
        reference_switch: I4     # per docs/recovered/FACTORY_SPECS.md
        motor_id: HBW_Y
        positions:
          rest: 90.0
          conveyor: 100.0
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

      # The cantilever / telescoping fork (Q7/Q8 on the real controller).
      # Horizontal, into the rack. This is what the old code called "Z", and
      # the two engines disagreed on its stroke: the planner used Z_EXTENDED=50
      # while the simulator used FORK_EXTENSION_MM=80. Resolved here, once.
      fork:
        kind: prismatic
        axis: +y
        limits: [0.0, 80.0]
        home: 0.0
        motor_id: HBW_Z
        positions:
          retracted: 10.0        # safe travel standoff
          carry: 25.0            # clear of the shelf, load on the fork
          extended: 50.0         # fully into a slot (slot depth is 50 mm)
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

  # --- Vacuum Gripper Robot --------------------------------------------------
  # NOT three linear axes. docs/recovered/FACTORY_SPECS.md records M3 as
  # "Motor rotate clockwise / counterclockwise" - the VGR is a cylindrical
  # R-P-P arm that swivels about a base column. hardware/mock_factory.py
  # modelled it as X/Y/Z prismatic, which is a fourth geometry defect and the
  # reason its "3D view" could never have looked like the real machine.
  vgr:
    kind: cylindrical_arm
    tool: suction
    base:
      xyz: [400.0, 260.0, 0.0]
    joints:
      swivel:
        kind: revolute
        axis: +z
        limits: [-95.0, 95.0]
        home: 0.0
        reference_switch: I3
        motor_id: VGR_X
        positions:
          conveyor: 0.0
          oven: -70.0
          delivery: 78.0
        drive:
          pulses_per_rev: 75
          gear_ratio: 57.0       # 57:1 reduction -> ~22.5 deg/s at the arm
          motor_rpm: 214.0

      reach:
        kind: prismatic
        axis: +y
        limits: [0.0, 180.0]
        home: 0.0
        reference_switch: I2
        motor_id: VGR_Y
        positions:
          retracted: 10.0
          conveyor: 120.0
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

      # Vertical suction column. +Z is up like everything else, so the arm
      # descending toward the table is a DECREASING plunge value. The old code
      # inverted the sign here relative to the HBW and documented the
      # inconsistency instead of fixing it.
      plunge:
        kind: prismatic
        axis: +z
        limits: [0.0, 140.0]
        home: 140.0
        reference_switch: I1
        motor_id: VGR_Z
        positions:
          raised: 140.0
          transit: 120.0
          pick: 100.0            # belt surface height
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
# The nine slots are GENERATED from this spec - there is deliberately no slot
# coordinate table anywhere in the codebase now. `order: bottom_up` is the one
# place row ordering is declared, settling the old row-A-is-top (mock_factory)
# versus row-A-is-bottom (models.py) contradiction.
racks:
  main:
    order: bottom_up
    origin:
      xyz: [100.0, 0.0, 100.0]
    slot_envelope: [60.0, 50.0, 60.0]
    rows:
      count: 3
      pitch: 100.0
      labels: [A, B, C]
    cols:
      count: 3
      pitch: 100.0
      labels: ["1", "2", "3"]

# -----------------------------------------------------------------------------
# Conveyor
# -----------------------------------------------------------------------------
# Belt-local 0 is the VGR end and 120 the HBW end, matching the original sensor
# constants. Speed is a belt, not a spindle drive, so it is given directly.
conveyor:
  length_mm: 120.0
  width_mm: 40.0
  max_speed_mm_s: 60.0
  motor_id: CONV_M1
  pose:
    xyz: [400.0, 140.0, 100.0]
  axis: -y
  sensors:
    I2:
      kind: light_barrier
      at_mm: 105.0               # HBW interface
      tolerance_mm: 10.0
    I3:
      kind: light_barrier
      at_mm: 15.0                # VGR interface
      tolerance_mm: 10.0
    I5:
      kind: trail
      rib_spacing_mm: 5.0
    I6:
      kind: trail
      rib_spacing_mm: 5.0
      inverted: true

# -----------------------------------------------------------------------------
# Named world stations
# -----------------------------------------------------------------------------
stations:
  oven:
    pose:
      xyz: [280.0, 330.0, 100.0]
    description: Baking station served by the VGR
  delivery:
    pose:
      xyz: [530.0, 320.0, 100.0]
    description: Outbound delivery zone

# -----------------------------------------------------------------------------
# Component registry
# -----------------------------------------------------------------------------
# Was seed_components() in database/models.py - 18 rows of configuration that
# had no business being database state. Electrical defaults come from
# hardware/mock_factory.py::ElectricalModel and are kept unchanged.
components:
  HBW_X:
    subsystem: hbw
    type: motor
    name: HBW horizontal travel
    electrical: {running_amps: 1.5}
  HBW_Y:
    subsystem: hbw
    type: motor
    name: HBW vertical lift
    electrical: {running_amps: 1.5}
  HBW_Z:
    subsystem: hbw
    type: motor
    name: HBW telescoping fork
    electrical: {running_amps: 1.0}
  HBW_REF_SW:
    subsystem: hbw
    type: sensor
    name: HBW reference switch

  VGR_X:
    subsystem: vgr
    type: motor
    name: VGR swivel
    electrical: {running_amps: 1.2}
  VGR_Y:
    subsystem: vgr
    type: motor
    name: VGR horizontal reach
    electrical: {running_amps: 1.2}
  VGR_Z:
    subsystem: vgr
    type: motor
    name: VGR vertical plunge
    electrical: {running_amps: 0.8}
  VGR_COMP:
    subsystem: vgr
    type: compressor
    name: VGR vacuum compressor
    electrical: {idle_amps: 0.1, startup_amps: 4.0, running_amps: 2.5}
  VGR_VALVE:
    subsystem: vgr
    type: valve
    name: VGR vacuum valve
    electrical: {idle_amps: 0.02, startup_amps: 0.5, running_amps: 0.3}

  CONV_M1:
    subsystem: conveyor
    type: motor
    name: Conveyor belt motor
    electrical: {running_amps: 1.2}
  CONV_LB_I2:
    subsystem: conveyor
    type: sensor
    name: Light barrier I2 (HBW interface)
  CONV_LB_I3:
    subsystem: conveyor
    type: sensor
    name: Light barrier I3 (VGR interface)
  CONV_TS_I5:
    subsystem: conveyor
    type: sensor
    name: Trail sensor I5
  CONV_TS_I6:
    subsystem: conveyor
    type: sensor
    name: Trail sensor I6

# -----------------------------------------------------------------------------
# Presentation
# -----------------------------------------------------------------------------
# scene_scale converts mm to metres for three.js. time_scale speeds up the
# DEMO only and is never applied to physics - with the corrected 14.27 mm/s a
# 300 mm move genuinely takes 21 s, and the honest fix for a slow demo is to
# say so here rather than to lie in the simulator.
render:
  scene_scale: 0.001
  time_scale: 1.0
  meshes:
    rack: assets/rack.glb
    hbw_carriage: assets/hbw_carriage.glb
    hbw_fork: assets/hbw_fork.glb
    vgr_column: assets/vgr_column.glb
    vgr_arm: assets/vgr_arm.glb
    conveyor: assets/conveyor.glb
    carrier: assets/carrier.glb
