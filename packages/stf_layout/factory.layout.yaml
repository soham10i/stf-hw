# =============================================================================
# Smart Tabletop Factory - canonical layout
# =============================================================================
# THE single source of truth for factory geometry. The kinematic planner, the
# simulation kernel, the browser's scene graph and the URDF exporter all read
# this file. Nothing else may hardcode a coordinate; tests/test_layout_invariants.py
# scans the source tree and fails the build if anything does.
#
# This file replaces four mutually contradictory coordinate tables that used to
# live in database/models.py (two of them), hardware/mock_factory.py (a third,
# with the rack rows inverted) and dashboard/app.py (a fourth). The planner and
# the physics engine were operating in different frames.
#
# Frame convention, declared once: right-handed, +Z up, origin at the
# front-bottom-left corner of the rack.
#
#   +X  travel along the rack face (columns 1..3, then out to the conveyor)
#   +Y  away from the rack face (fork extension direction, belt run)
#   +Z  up (shelf rows A..C)
#
# Axes are NAMED, never numbered. The old code called the HBW's horizontal
# telescoping fork and the VGR's vertical suction column both "the Z axis",
# which is precisely how the two kinematic engines silently disagreed.
# =============================================================================

schema_version: 1

units:
  length: mm
  angle: deg
  time: s
  current: A
  voltage: V

frame:
  handedness: right
  up: z
  origin: rack_front_bottom_left

# -----------------------------------------------------------------------------
# Devices
# -----------------------------------------------------------------------------
devices:

  # --- High-Bay Warehouse stacker crane -------------------------------------
  # Cartesian: travels along the rack, lifts, and telescopes a fork into a slot.
  # Drive data from docs/144643-Encodermotor24V.pdf; the 214 rpm figure is the
  # lab calibration recorded in hardware/hbw_withfaults_simulation.py, which was
  # dead code (its constructor was misspelled `_init_`) but held the only real
  # measurement in the repository.
  #
  #   75 pulses/rev / 4 mm pitch = 18.75 pulses/mm
  #   60 / (214 rpm * 75)        = 3.738 ms/pulse
  #   => 14.27 mm/s
  #
  # The old simulator hardcoded 100 mm/s, i.e. it ran 7.01x too fast.
  hbw:
    kind: cartesian_stacker
    tool: fork
    # The mast and carriage sit in an AISLE in front of the rack (manual: the
    # stacker crane "moves in an aisle between the rack rows"). The rack face is
    # at depth y=0; the crane base is offset to y=-55 so the mast never passes
    # through a bay. Only the fork (Ausleger) telescopes from the aisle into a
    # bay. This is the fix for the crane visibly moving through the storage boxes.
    base:
      xyz: [0.0, -55.0, 0.0]
    joints:
      travel:
        kind: prismatic
        axis: +x
        # Columns at 100/220/340 (120 mm grid pitch, see racks.main), handover
        # right of the rack at 460 - the rack posts end at x=409, the mast (30
        # wide) clears them by 36 mm. M2 on the real controller (Q3/Q4).
        limits: [0.0, 460.0]
        home: 0.0
        reference_switch: I1     # horizontal ref (Belegungsplan: I2/I3 are light barriers)
        motor_id: HBW_X
        positions:
          rest: 460.0
          conveyor: 460.0
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

      lift:
        kind: prismatic
        axis: +z
        # Rows at 40/160/280 (measured from the module photos: carrier rows sit
        # 39/159/279 mm above the plate). Must reach 280+8 for a top-row store.
        # M3 on the real controller (Q5/Q6).
        limits: [0.0, 300.0]
        home: 0.0
        reference_switch: I4     # per docs/recovered/FACTORY_SPECS.md
        motor_id: HBW_Y
        positions:
          rest: 100.0
          conveyor: 100.0
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

      # The cantilever / Ausleger (Q7/Q8, M4 on the real controller). It is
      # BIDIRECTIONAL - the Belegungsplan gives it front AND back reference
      # switches (I5 vorne / I6 hinten): it extends forward (+y) into a rack
      # bay and backward (-y) over the conveyor, which runs parallel to the
      # rack along the front (Abbildung 7). The first model missed this and
      # only extended toward the rack, so the belt handoff teleported the
      # carrier across the lane.
      #
      # Stop positions are set so the table and the carrier on it never clip
      # the rack face while travelling: the aisle runs from the rack face
      # (y=0) to the belt's near edge (y=-90), so at the carry stop the table
      # (60 mm deep) spans -75..-15 and the carrier (48 mm) -69..-21 - both
      # fully inside the aisle. At the extended stop (85) the crane base offset
      # (-55) puts the carrier centre at y=+30 = the bay centre and the table
      # spans 0..60 = exactly the bay depth, flush with the rack face; the
      # table is 30 mm wide so it slides between the shelf rails (inner faces
      # at +/-17) with 2 mm of clearance per side.
      fork:
        kind: prismatic
        axis: +y
        limits: [-70.0, 90.0]
        home: 0.0
        reference_switch: I5     # vorne; I6 = hinten (Belegungsplan)
        motor_id: HBW_Z
        positions:
          retracted: 5.0         # safe travel standoff
          carry: 10.0            # carrier fully inside the aisle, clear of the rack
          extended: 85.0         # carrier to bay centre; table 0..60 = bay depth
          belt: -55.0            # back over the belt centreline (lane -55 -> -110)
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

  # --- Vacuum Gripper Robot --------------------------------------------------
  # NOT three linear axes. docs/recovered/FACTORY_SPECS.md records M3 as
  # "Motor rotate clockwise / counterclockwise" - the VGR is a cylindrical
  # R-P-P arm that swivels about a base column. hardware/mock_factory.py
  # modelled it as X/Y/Z prismatic, which is a fourth geometry defect and the
  # reason its "3D view" could never have looked like the real machine.
  vgr:
    kind: cylindrical_arm
    tool: suction
    # Stands just BEYOND the belt's far (VGR) end, in line with the belt
    # centreline - the Foerderband ends right at the tower base plate, exactly
    # as in the chained factory photos. At swivel=0 the arm reaches back ALONG
    # the belt axis (-x): base (600,-110) - reach 95 puts the suction cup at
    # (505,-110) = belt-local 15, exactly the I3 pick window. The previous
    # model stood the tower 120mm in FRONT of the belt (perpendicular,
    # reaching +y toward the rack) - a 90-degree error in the VGR's direction
    # with respect to the HBW - and an intermediate version parked it at
    # x=640, leaving a 60 mm gap between the belt end and the tower base.
    base:
      xyz: [600.0, -110.0, 0.0]
    joints:
      swivel:
        kind: revolute
        axis: +z
        # Home (reference switch I3) faces the belt (-x). Positive swivel sweeps
        # the arm across the front of the tower (-y side), where the downstream
        # stations fan out: oven at +55, delivery at +105. Negative angles point
        # the arm over the belt stub beside the tower; +y would carry it into
        # the rack line, so the positive range is the working side.
        limits: [-95.0, 135.0]
        home: 0.0
        reference_switch: I3
        motor_id: VGR_X
        positions:
          conveyor: 0.0
          oven: 55.0
          delivery: 105.0
        drive:
          pulses_per_rev: 75
          gear_ratio: 57.0       # 57:1 reduction -> ~22.5 deg/s at the arm
          motor_rpm: 214.0

      reach:
        kind: prismatic
        axis: -x               # the arm's home direction (toward the belt)
        limits: [0.0, 180.0]
        home: 0.0
        reference_switch: I2
        motor_id: VGR_Y
        positions:
          retracted: 10.0
          conveyor: 95.0         # base x=600 -> cup at x=505, the I3 window
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

      # Vertical suction column. +Z is up like everything else, so the arm
      # descending toward the table is a DECREASING plunge value. The old code
      # inverted the sign here relative to the HBW and documented the
      # inconsistency instead of fixing it.
      #
      # `transit` is high enough that a gripped carrier (tray bottom at
      # plunge-14 mm) clears the belt's side rails (top at z=115) while the
      # arm retracts and swivels - at the old transit of 120 the tray dragged
      # through the rails.
      plunge:
        kind: prismatic
        axis: +z
        limits: [0.0, 160.0]
        home: 155.0
        reference_switch: I1
        motor_id: VGR_Z
        positions:
          raised: 155.0
          transit: 145.0         # tray bottom 131 > rail tops 115
          pick: 100.0            # cup down at the belt surface
        drive:
          pulses_per_rev: 75
          spindle_pitch_mm: 4.0
          motor_rpm: 214.0

# -----------------------------------------------------------------------------
# Storage
# -----------------------------------------------------------------------------
# The nine slots are GENERATED from this spec - there is deliberately no slot
# coordinate table anywhere in the codebase now. `order: bottom_up` is the one
# place row ordering is declared, settling the old row-A-is-top (mock_factory)
# versus row-A-is-bottom (models.py) contradiction.
racks:
  main:
    order: bottom_up
    # Measured against the real module (600x400x320 mm, Christiani datasheet)
    # and the annotated factory photos: the 3x3 grid sits on the 15 mm
    # fischertechnik raster at a SQUARE 120 mm (8-unit) pitch. Carrier rows
    # rest 40/160/280 mm above the plate (photo: 39/159/279); bay centres at
    # x=100/220/340 with 18 mm uprights on the grid lines x=40/160/280/400.
    # The opening is 100 wide x 60 deep x 80 high: a 48 mm carrier + 18 mm
    # workpiece enters 8 mm above its rest height with 2 mm to spare at the
    # opening top, and the 30 mm fork table slides between the shelf rails
    # (inner faces +/-17) with 2 mm per side.
    origin:
      xyz: [100.0, 0.0, 40.0]
    slot_envelope: [100.0, 60.0, 80.0]
    rows:
      count: 3
      pitch: 120.0
      labels: [A, B, C]
    cols:
      count: 3
      pitch: 120.0
      labels: ["1", "2", "3"]

# -----------------------------------------------------------------------------
# Conveyor
# -----------------------------------------------------------------------------
# The Foerderband runs PARALLEL to the rack along the front of the module,
# spanning the full module width as on the real machine (Abbildung 7: Hochregal
# at the back, Hochregalbediengeraet in the middle lane, "Foerdertechnik mit
# Identifikation" as the front lane) - all three in the same lane direction.
# The crane deposits by extending its Ausleger backward over the belt at x=460
# (belt-local 60, right of the rack; I2 at 105mm); the belt then carries the
# tray along x, past the identification sensors, to the VGR end at x=520
# (belt-local 0, I3 at 15mm), where the gripper picks. The belt's far end
# points at the VGR tower.
#
# The belt is 60 mm wide so the 48 mm carrier rides the web between the side
# guide rails. At the crane handover (belt-local 43..77) the web carries a
# 34 mm transfer slot: the 30 mm Ausleger table lowers through it to set the
# carrier down, and the 48 mm carrier bridges the slot and stays on the web -
# the same transfer notch a real Uebergabestation uses.
conveyor:
  length_mm: 460.0                # x=60..520: the whole front lane of the module
  width_mm: 60.0                  # the 48 mm carrier rides the web between the guides
  max_speed_mm_s: 60.0
  motor_id: CONV_M1
  pose:
    xyz: [520.0, -110.0, 100.0]   # VGR end (belt-local 0), one lane in front
  axis: -x                         # runs back toward the crane transfer at x=460
  sensors:
    I2:
      kind: light_barrier
      at_mm: 105.0               # HBW interface
      tolerance_mm: 10.0
    I3:
      kind: light_barrier
      at_mm: 15.0                # VGR interface
      tolerance_mm: 10.0
    I5:
      kind: trail
      rib_spacing_mm: 5.0
    I6:
      kind: trail
      rib_spacing_mm: 5.0
      inverted: true

# -----------------------------------------------------------------------------
# Named world stations
# -----------------------------------------------------------------------------
# Each station pose is DERIVED from the VGR's own kinematics so the two can
# never drift apart: station = vgr.base + R_z(swivel.positions[name]) . arm,
# where arm = (-reach.conveyor, 0, 0) at swivel=0, at belt surface height.
# The previous table put both stations at y=+330 - behind the rack and 550 mm
# from the old VGR base, three times the arm's reach: physically unreachable,
# and inconsistent with the swivel angles that claimed to serve them.
#
#   oven:     swivel +55 deg  -> (600, -110) + 95 * (-cos55, -sin55)
#   delivery: swivel +105 deg -> (600, -110) + 95 * (-cos105, -sin105)
stations:
  oven:
    pose:
      xyz: [545.5, -187.8, 100.0]
    description: Baking station served by the VGR (swivel +55 deg)
  delivery:
    pose:
      xyz: [624.6, -201.8, 100.0]
    description: Outbound delivery zone (swivel +105 deg)

# -----------------------------------------------------------------------------
# Module base plates (render-only)
# -----------------------------------------------------------------------------
# The real factory chains several dark fischertechnik plates on a big white
# table - it is NOT one slab. Rectangles are factory-frame millimetres
# (origin = minimum corner, size = dx/dy), estimated from the factory photos
# (docs/FACTORY_GROUND_TRUTH.md section 1). The HBW plate carries the rack,
# crane and belt and ends where the VGR plate begins; the processing plate
# holds the oven at its back edge, closest to the VGR tower, exactly like the
# Bearbeitungsstation in Abbildung 9.
modules:
  hbw:
    origin:
      xyz: [-80.0, -160.0, 0.0]
    size: [600.0, 400.0]          # the real module plate (Christiani datasheet)
    label: Hochregallager
  vgr:
    origin:
      xyz: [530.0, -170.0, 0.0]
    size: [160.0, 140.0]          # the tower's own small plate at the belt end
    label: Vakuum-Sauggreifer
  processing:
    origin:
      xyz: [440.0, -340.0, 0.0]
    size: [320.0, 160.0]          # oven at the back edge; room in front for Drehtisch + sorting
    label: Bearbeitungsstation

# -----------------------------------------------------------------------------
# Component registry
# -----------------------------------------------------------------------------
# Was seed_components() in database/models.py - 18 rows of configuration that
# had no business being database state. Electrical defaults come from
# hardware/mock_factory.py::ElectricalModel and are kept unchanged.
components:
  HBW_X:
    subsystem: hbw
    type: motor
    name: HBW horizontal travel
    electrical: {running_amps: 1.5}
  HBW_Y:
    subsystem: hbw
    type: motor
    name: HBW vertical lift
    electrical: {running_amps: 1.5}
  HBW_Z:
    subsystem: hbw
    type: motor
    name: HBW telescoping fork
    electrical: {running_amps: 1.0}
  HBW_REF_SW:
    subsystem: hbw
    type: sensor
    name: HBW reference switch

  VGR_X:
    subsystem: vgr
    type: motor
    name: VGR swivel
    electrical: {running_amps: 1.2}
  VGR_Y:
    subsystem: vgr
    type: motor
    name: VGR horizontal reach
    electrical: {running_amps: 1.2}
  VGR_Z:
    subsystem: vgr
    type: motor
    name: VGR vertical plunge
    electrical: {running_amps: 0.8}
  VGR_COMP:
    subsystem: vgr
    type: compressor
    name: VGR vacuum compressor
    electrical: {idle_amps: 0.1, startup_amps: 4.0, running_amps: 2.5}
  VGR_VALVE:
    subsystem: vgr
    type: valve
    name: VGR vacuum valve
    electrical: {idle_amps: 0.02, startup_amps: 0.5, running_amps: 0.3}

  CONV_M1:
    subsystem: conveyor
    type: motor
    name: Conveyor belt motor
    electrical: {running_amps: 1.2}
  CONV_LB_I2:
    subsystem: conveyor
    type: sensor
    name: Light barrier I2 (HBW interface)
  CONV_LB_I3:
    subsystem: conveyor
    type: sensor
    name: Light barrier I3 (VGR interface)
  CONV_TS_I5:
    subsystem: conveyor
    type: sensor
    name: Trail sensor I5
  CONV_TS_I6:
    subsystem: conveyor
    type: sensor
    name: Trail sensor I6

# -----------------------------------------------------------------------------
# Presentation
# -----------------------------------------------------------------------------
# scene_scale converts mm to metres for three.js. time_scale speeds up the
# DEMO only and is never applied to physics - with the corrected 14.27 mm/s a
# 300 mm move genuinely takes 21 s, and the honest fix for a slow demo is to
# say so here rather than to lie in the simulator.
render:
  scene_scale: 0.001
  time_scale: 1.0
  meshes:
    rack: assets/rack.glb
    hbw_carriage: assets/hbw_carriage.glb
    hbw_fork: assets/hbw_fork.glb
    vgr_column: assets/vgr_column.glb
    vgr_arm: assets/vgr_arm.glb
    conveyor: assets/conveyor.glb
    carrier: assets/carrier.glb
