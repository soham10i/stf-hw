[project]
name = "stf-digital-twin"
version = "4.0.0"
description = "Digital twin of a Fischertechnik-style smart tabletop factory"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "packages"}

[tool.setuptools.packages.find]
where = ["packages"]

[tool.setuptools.package-data]
stf_layout = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["packages"]
# tests/legacy holds the pre-rearchitecture hand-rolled runners. They are not
# pytest-collectible (their Test* classes define __init__) and several assert
# stale 1200mm-belt geometry against the current 120mm belt. Kept for reference
# until their replacements land, then deleted.
addopts = "-q --strict-markers --ignore=tests/legacy"
markers = [
    "unit: fast, no I/O",
    "golden: golden-file regression",
    "integration: needs containers or a live service",
    "contract: cross-language or cross-adapter contract",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Pre-rearchitecture code, scheduled for deletion as each replacement lands.
extend-exclude = [
    "tests/legacy",
    "api",
    "controller",
    "dashboard",
    "database",
    "hardware",
    "scripts",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# str+Enum rather than StrEnum: it is the idiom pydantic's docs use for
# serialisable enums and it reads the same on every supported Python.
ignore = ["UP042"]

[tool.ruff.lint.isort]
known-first-party = ["stf_layout", "stf_kernel"]
